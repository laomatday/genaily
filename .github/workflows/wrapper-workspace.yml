name: Wrapper workspace
on:
  push:
    branches: [feat/capacitor-unified-child-app]
    paths: [.github/workflows/wrapper-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export tracked source for integration tests
        run: git archive --format=zip -o /tmp/genaily-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrapper-source
          path: /tmp/genaily-source.zip
          retention-days: 1
