name: Wrapper integration
on:
  push:
    branches: [feat/capacitor-unified-child-app]
    paths: [.github/workflows/wrapper-integration.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/capacitor-unified-child-app'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Apply checked integration and pin npm lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-wrapper-integration.py')
          text = p.read_text()
          old = "    assert text.count(before) == count"
          new = "    if path == '.gitignore':\n        file.write_text(text + '\\ndist-native/\\nandroid-delivery/\\nwrapper-test-output/\\n')\n        return\n    assert text.count(before) == count"
          assert old in text
          p.write_text(text.replace(old, new))
          PY
          python3 scripts/apply-wrapper-integration.py
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm run check:wrapper
      - name: Persist generated sources only to the integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/wrapper-integration.yml .github/workflows/wrapper-workspace.yml scripts/apply-wrapper-integration.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(android): integrate Capacitor wrapper, parent-authorized setup and pinned dependencies'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/capacitor-unified-child-app
          echo "GENAI_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "GENAI_VERSION_NAME=0.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "GENAI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          git archive --format=zip -o /tmp/genaily-wrapper-source.zip HEAD
      - name: Web tests and packaged assets
        run: |
          npm test
          npm run android:sync
          node scripts/check-wrapper.mjs --assets
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
      - name: Android unit tests, lint and build
        working-directory: mobile/android
        run: gradle --no-daemon :app:verifyProductionConfiguration :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Package verified pilot
        run: |
          mkdir -p android-delivery
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk android-delivery/genaily-wrapper-pilot.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android-delivery/genaily-wrapper-pilot.apk
          (cd android-delivery && sha256sum genaily-wrapper-pilot.apk > SHA256SUMS.txt)
          printf 'Commit: %s\nVersion: %s\nBackend: production\nScope: selected-app protection pilot\n' "$GENAI_BUILD_SHA" "$GENAI_VERSION_NAME" > android-delivery/BUILD.txt
          cp docs/CAPACITOR_WRAPPER.md android-delivery/INSTALL.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genaily-wrapper-pilot
          path: android-delivery/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wrapper-integration-reports
          path: |
            /tmp/genaily-wrapper-source.zip
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 2
