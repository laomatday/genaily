name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'scripts/check-android-production.py'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'scripts/check-android-production.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'pilot: installable test APK; release: requires private signing secrets'
        required: true
        type: choice
        default: pilot
        options: [pilot, release]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event_name }}-${{ inputs.channel || 'pilot' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GENAI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release source
        if: inputs.channel == 'release'
        shell: bash
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - name: Build version
        shell: bash
        run: |
          echo "GENAI_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "GENAI_VERSION_NAME=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Optional public configuration overrides
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CONFIG_URL: ${{ vars.GENAI_DEVICE_AGENT_URL }}
          CONFIG_KEY: ${{ secrets.GENAI_PUBLISHABLE_KEY || vars.GENAI_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import re
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for source, target in [('CONFIG_URL', 'GENAI_DEVICE_AGENT_URL'), ('CONFIG_KEY', 'GENAI_PUBLISHABLE_KEY')]:
                  value = os.environ.get(source, '').strip()
                  if value:
                      if '\n' in value or '\r' in value:
                          raise SystemExit('Configuration override must be a single line')
                      if source == 'CONFIG_KEY' and not re.fullmatch(r'sb_publishable_[A-Za-z0-9_-]{20,160}', value):
                          raise SystemExit('Only publishable keys can be embedded in an APK')
                      out.write(f'{target}={value}\n')
          PY
      - name: Validate production configuration
        run: python3 scripts/check-android-production.py
      - name: Non-mutating production API smoke test
        if: github.event_name != 'pull_request'
        run: python3 scripts/check-android-production.py --probe
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '9.6.0'
          cache-disabled: true
      - name: Unit tests, lint and pilot APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:verifyProductionConfiguration :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Sign production release
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'release'
        working-directory: mobile/android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/genaily-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import base64
          import os
          required = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Missing release signing secrets. Use channel=pilot for internal tests.')
          os.umask(0o077)
          with open(os.environ['ANDROID_KEYSTORE_PATH'], 'wb') as out:
              out.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          PY
          gradle --no-daemon :app:lintRelease :app:assembleRelease
      - name: Package verified APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel || 'pilot' }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = release ]; then
            SOURCE=mobile/android/app/build/outputs/apk/release/app-release.apk
          else
            SOURCE=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p android-delivery
          APK="genaily-${CHANNEL}-${GENAI_VERSION_NAME}-${GITHUB_SHA:0:7}.apk"
          cp "$SOURCE" "android-delivery/$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "android-delivery/$APK"
          (cd android-delivery && sha256sum "$APK" > SHA256SUMS.txt)
          printf 'Channel: %s\nBackend: production\nCommit: %s\nVersion: %s\n' \
            "$CHANNEL" "$GITHUB_SHA" "$GENAI_VERSION_NAME" > android-delivery/BUILD.txt
          cp docs/ANDROID_APK.md android-delivery/INSTALL.md
          {
            echo '## Android delivery'
            echo "- Channel: **$CHANNEL**; backend: **production**"
            echo "- APK: \`$APK\`"
            echo '- Download the artifact below, unzip it, then install the APK on the child Android device.'
            echo '- Open Chẩn đoán kết nối → Kiểm tra API before entering a NEW Android pairing code.'
            echo '- Pilot uses a debug certificate and separate .pilot application ID; it is not a store release.'
            echo '- This build does not prove pairing or Study Lock works on a physical device.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genaily-android-${{ inputs.channel || 'pilot' }}-${{ github.run_number }}
          path: android-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/genaily-release.jks"
