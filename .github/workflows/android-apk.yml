name: Android APK

on:
  push:
    branches: [main, feat/capacitor-unified-child-app]
    paths:
      - 'mobile/android/**'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'scripts/*native*'
      - 'scripts/*wrapper*'
      - 'scripts/check-android-production.py'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'scripts/*native*'
      - 'scripts/*wrapper*'
      - 'scripts/check-android-production.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'pilot: test wrapper; release: requires private signing secrets'
        required: true
        type: choice
        default: pilot
        options: [pilot, release]

permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event_name }}-${{ inputs.channel || 'pilot' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GENAI_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate release source
        if: inputs.channel == 'release'
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
      - name: Build version
        run: |
          echo "GENAI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "GENAI_VERSION_NAME=0.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Optional public configuration overrides
        if: github.event_name != 'pull_request'
        env:
          CONFIG_URL: ${{ vars.GENAI_DEVICE_AGENT_URL }}
          CONFIG_KEY: ${{ secrets.GENAI_PUBLISHABLE_KEY || vars.GENAI_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for source, target in [('CONFIG_URL', 'GENAI_DEVICE_AGENT_URL'), ('CONFIG_KEY', 'GENAI_PUBLISHABLE_KEY')]:
                  value = os.environ.get(source, '').strip()
                  if value:
                      if '\n' in value or '\r' in value:
                          raise SystemExit('Configuration override must be one line')
                      if source == 'CONFIG_KEY' and not re.fullmatch(r'sb_publishable_[A-Za-z0-9_-]{20,160}', value):
                          raise SystemExit('Only publishable keys may be embedded')
                      out.write(f'{target}={value}\n')
          PY
      - name: Validate production configuration
        run: python3 scripts/check-android-production.py
      - name: Non-mutating production API smoke test
        id: api_probe
        continue-on-error: ${{ inputs.channel != 'release' }}
        if: github.event_name != 'pull_request'
        run: python3 scripts/check-android-production.py --probe
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate web code and build bundled interface
        run: |
          npm ci
          npm run lint:code
          npm run typecheck
          npm test
          npm run check:wrapper
          npm run android:sync
          node scripts/check-wrapper.mjs --assets
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14.3'
          cache-disabled: true
      - name: Unit tests, lint and pilot APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:verifyProductionConfiguration :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Sign production release
        if: github.event_name == 'workflow_dispatch' && inputs.channel == 'release'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/genaily-release.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 - <<'PY'
          import base64, os
          required = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Missing release signing secrets. No debug-signing fallback.')
          os.umask(0o077)
          with open(os.environ['ANDROID_KEYSTORE_PATH'], 'wb') as out:
              out.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          PY
          gradle --no-daemon :app:lintRelease :app:assembleRelease
      - name: Package verified APK
        if: github.event_name != 'pull_request'
        env:
          CHANNEL: ${{ inputs.channel || 'pilot' }}
          API_PROBE: ${{ steps.api_probe.outcome }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = release ]; then
            SOURCE=mobile/android/app/build/outputs/apk/release/app-release.apk
          else
            SOURCE=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p android-delivery
          APK="genaily-wrapper-${CHANNEL}-${GENAI_VERSION_NAME}-${GITHUB_SHA:0:7}.apk"
          cp "$SOURCE" "android-delivery/$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "android-delivery/$APK"
          (cd android-delivery && sha256sum "$APK" > SHA256SUMS.txt)
          printf 'Channel: %s\nBackend: production\nCommit: %s\nVersion: %s\nAPI probe: %s\n' "$CHANNEL" "$GITHUB_SHA" "$GENAI_VERSION_NAME" "$API_PROBE" > android-delivery/BUILD.txt
          cp docs/CAPACITOR_WRAPPER.md android-delivery/INSTALL.md
          {
            echo '## genaily web-first Android wrapper'
            echo "- APK: \`$APK\`; API probe: **$API_PROBE**"
            echo '- Bundled React UI and native Study Lock in one application.'
            echo '- Parent signs in once on the child phone, selects Child, then completes integrated setup.'
            echo '- Pilot: selected-app restrictions with safety timeout, NOT full-device supervision.'
            echo '- Build success is not physical-device pairing or anti-bypass verification.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genaily-wrapper-${{ inputs.channel || 'pilot' }}-${{ github.run_number }}
          path: android-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/genaily-release.jks"
